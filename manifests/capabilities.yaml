version: 1
capabilities:
  - id: auth.token.refresh
    uri_pattern: ifuri://auth/token/{token_id}/commands/refresh
    contract:
      input: google.protobuf.Struct
      output: google.protobuf.Struct
    semantics:
      kind: command
      idempotent: true
      durable: false
    placement:
      runtime: auth-runtime
    transport:
      preferred: inproc
      fallback: [nats]

  - id: scenario.execute
    uri_pattern: ifuri://scenario/scenario/{scenario_id}/commands/execute
    contract:
      input: google.protobuf.Struct
      output: google.protobuf.Struct
