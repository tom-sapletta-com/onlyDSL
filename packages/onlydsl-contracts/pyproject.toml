[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "onlydsl-contracts"
version = "0.0.11"
description = "Pure DSL, IFURI and SSOT contracts shared by onlyDSL clients"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onlydsl_contracts = ["schemas/*.gbnf", "schemas/*.json", "schemas/ifuri/v1/*.proto"]
