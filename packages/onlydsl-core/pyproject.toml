[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "onlydsl-core"
version = "0.0.12"
description = "Transport-neutral IFURI routing and wire runtime for onlyDSL"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "onlydsl-contracts>=0.0.10,<0.1",
  "protobuf>=6.30,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
