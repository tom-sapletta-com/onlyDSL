[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "onlydsl-ssot"
version = "0.0.9"
description = "Atomic accepted-state storage and revision workflow for onlyDSL"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["onlydsl-contracts==0.0.9"]

[tool.setuptools.packages.find]
where = ["src"]
